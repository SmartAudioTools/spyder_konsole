[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyder-konsole"
version = "0.1.0"
description = "Terminal integre a Spyder : le moteur de Konsole (QTermWidget) dans un dock, sans navigateur embarque ni serveur local"
requires-python = ">=3.9"
# Aucune dependance PyPI en dehors de ce que Spyder apporte deja : le moteur est la
# bibliotheque systeme libqtermwidget6, atteinte par le binding shiboken de
# qtermwidget_binding/build.sh — rien a resoudre par pip, mais quelque chose a CONSTRUIRE,
# ce que setup.py (a cote de ce fichier) branche sur « pip install [-e] ».
#
# Le moteur (konsole_view.py, l'enveloppe autour de ce binding) vit DANS ce paquet depuis
# le 09/08/2026 : sorti vers un paquet smartos-konsole a part le 31/07 (independance des
# greffons Terminal et Claude), rapatrie quand spyder-claude a pu le declarer en dependance
# pip — le nom smartos-konsole etait mal choisi, le moteur tient a KDE, pas a SmartOS.
dependencies = ["qtpy", "qtawesome"]

# Spyder decouvre les greffons tiers par ce groupe de points d'entree. Le nom du point
# d'entree DOIT etre identique a l'attribut NAME de la classe, sinon Spyder leve une
# SpyderAPIError et ignore le greffon (spyder/app/find_plugins.py, find_external_plugins).
[project.entry-points."spyder.plugins"]
native_terminal = "spyder_konsole.spyder.plugin:TerminalNatif"

[tool.setuptools.packages.find]
include = ["spyder_konsole*"]
